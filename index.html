# 高精度立体操作式三次元計算端末 // 狂瀾豪華・虹彩電脳光沢極大改造版

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高精度立体操作式三次元計算端末</title>
    <style>
        /* 基礎画面設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040508;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;

            color: #e2e8f0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 画面全体の予期せぬズレを完全ロック */
        }

        /* 主枠構造 */
        #interface-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 3D空間描画画布領域 */
        #canvas-section {
            width: 100%;
            height: 100%;
            background-color: #020305;
            position: relative;

        }

        /* 画面左上の案内テキスト */
        #guide-text {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 11px;
            color: #8b949e;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5;
            line-height: 1.6;
            background: rgba(4, 5, 8, 0.95);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #ff007f; /* 派手なネオンピンクの枠線 */
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
        }

    </style>
    <!-- 三次元描画のための外部部品読み込み（許可されたCDN） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="interface-container">
        
        <!-- 3D表示領域 -->
        <div id="canvas-section">
            <div id="guide-text">
                【狂瀾豪華・虹彩電脳光沢極大改造版 操作案内】<br>
                ・立体ボタンを直接叩く（クリック／タップ）<br>
                ・実機を回す：外側を引く（ドラッグ／スワイプ）<br>
                ※文字の歪み補正済 ／ 200ミリ秒連続打鍵ロック稼働中<br>
                【新設の便利機能】開平：ルート / 逆数：1/x / 円周率：π / 階乗：n!<br>
                【もっともっと派手な演出】動的虹彩オーロラ発光液晶 ＆ 超ダイナミック打鍵ストローク内包
            </div>
        </div>


    </div>

    <script>
        // --- 1. 計算処理・内部変数管理ロジック（完全英語禁止・外部HTML依存なし） ---
        let 内部入力値 = "0";
        let 内部数式文字列 = "";
        let 内部計算完了フラグ = false;
        let 内部補助画面文字列 = ""; 

        let lastInputTime = 0;
        const INPUT_LOCK_INTERVAL = 200; // 0.2秒ロック

        // 派手な演出用：現在の虹彩色彩フェーズを管理する変数
        let 色彩色彩変量 = 0;

        function toHalfWidthNum(str) {
            return str.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/．/g, '.');
        }


        function toFullWidthNum(str) {
            return String(str).replace(/[0-9.]/g, s => s === '.' ? '．' : String.fromCharCode(s.charCodeAt(0) + 0xFEE0));
        }

        function 計算階乗(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let 積 = 1;
            for (let i = 2; i <= n; i++) {
                積 *= i;
                if (積 === Infinity) return Infinity;
            }
            return 積;
        }

        function pressKey(key) {
            const currentTime = Date.now();
            if (currentTime - lastInputTime < INPUT_LOCK_INTERVAL) return;
            lastInputTime = currentTime;


            // ボタンが押されるたびに色彩変量を大きくジャンプさせ、液晶の色を劇的に変化させる
            色彩色彩変量 += 65;
            triggerButtonAnimation(key);

            if (key === '消去') {
                内部入力値 = "0";
                内部数式文字列 = "";
                内部補助画面文字列 = "";
                内部計算完了フラグ = false;
            } else if (key === '払') {
                内部入力値 = "0";
            } else if (key === '弾') {
                if (内部計算完了フラグ) {
                    内部数式文字列 = "";
                    内部補助画面文字列 = "";
                    内部計算完了フラグ = false;
                } else if (内部入力値 !== "0" && 内部入力値 !== "計算誤り") {
                    内部入力値 = 内部入力値.slice(0, -1);
                    if (内部入力値 === "" || 内部入力値 === "ー") 内部入力値 = "0";

                }
            } else if (key === '正負') {
                if (内部入力値 !== "0" && 内部入力値 !== "計算誤り") {
                    内部入力値 = 内部入力値.startsWith('ー') ? 内部入力値.substring(1) : 'ー' + 内部入力値;
                }
            } else if (key === '乗') {
                if (内部入力値 !== "計算誤り" && 内部入力値 !== "0") {
                    try {
                        let num = parseFloat(toHalfWidthNum(内部入力値));
                        内部入力値 = toFullWidthWidthClean(num * num);
                        内部計算完了フラグ = true;
                    } catch(e) { 内部入力値 = "計算誤り"; }
                }
            } else if (key === '％') {
                if (内部入力値 !== "計算誤り" && 内部入力値 !== "0") {
                    try {
                        let num = parseFloat(toHalfWidthNum(内部入力値));
                        内部入力値 = toFullWidthWidthClean(num / 100);
                    } catch(e) { 内部入力値 = "計算誤り"; }

                }
            } else if (key === '開平') {
                if (内部入力値 !== "計算誤り") {
                    try {
                        let num = parseFloat(toHalfWidthNum(内部入力値));
                        if (num < 0) {
                            内部入力値 = "計算誤り";
                        } else {
                            内部入力値 = toFullWidthWidthClean(Math.sqrt(num));
                            内部計算完了フラグ = true;
                        }
                    } catch(e) { 内部入力値 = "計算誤り"; }
                }
            } else if (key === '逆数') {
                if (内部入力値 !== "計算誤り" && 内部入力値 !== "0") {
                    try {
                        let num = parseFloat(toHalfWidthNum(内部入力値));
                        if (num === 0) {
                            内部入力値 = "計算誤り";

                        } else {
                            内部入力値 = toFullWidthWidthClean(1 / num);
                            内部計算完了フラグ = true;
                        }
                    } catch(e) { 内部入力値 = "計算誤り"; }
                }
            } else if (key === '円周') {
                内部入力値 = toFullWidthWidthClean(Math.PI);
                if (内部計算完了フラグ) 内部計算完了フラグ = false;
            } else if (key === '階乗') {
                if (内部入力値 !== "計算誤り") {
                    try {
                        let num = parseFloat(toHalfWidthNum(内部入力値));
                        if (num % 1 !== 0 || num < 0 || num > 170) {
                            内部入力値 = "計算誤り";
                        } else {
                            内部入力値 = toFullWidthWidthClean(計算階乗(num));
                            内部計算完了フラグ = true;
                        }

                    } catch(e) { 内部入力値 = "計算誤り"; }
                }
            } else if (key === '＝') {
                if (内部数式文字列 === "" && 内部入力値 === "0") return;
                try {
                    let calcFormula = (内部数式文字列 + 内部入力値)
                        .replace(/＋/g, '+').replace(/ー/g, '-').replace(/×/g, '*').replace(/÷/g, '/');
                    calcFormula = toHalfWidthNum(calcFormula);

                    let result = Function('return ' + calcFormula)();
                    内部補助画面文字列 = 内部数式文字列 + 内部入力値 + " ＝";
                    内部入力値 = toFullWidthWidthClean(result);
                    内部数式文字列 = "";
                    内部計算完了フラグ = true;
                    色彩色彩変量 += 120; // イコール時はさらにド派手に色彩をジャンプ
                } catch (e) {
                    内部入力値 = "計算誤り";
                }
            } else if (['＋', 'ー', '×', '÷'].includes(key)) {

                if (内部計算完了フラグ) {
                    内部数式文字列 = 内部入力値 + " " + key + " ";
                    内部計算完了フラグ = false;
                } else {
                    if (内部入力値 === "0" && 内部数式文字列 !== "") {
                        内部数式文字列 = 内部数式文字列.slice(0, -3) + " " + key + " ";
                    } else {
                        内部数式文字列 += 内部入力値 + " " + key + " ";
                    }
                }
                内部入力値 = "0";
                内部補助画面文字列 = 内部数式文字列;
            } else {
                if (内部計算完了フラグ) {
                    内部入力値 = key;
                    内部計算完了フラグ = false;
                } else {
                    if (内部入力値 === "0" && key !== '．') {
                        内部入力値 = key;

                    } else {
                        if (key === '．' && 内部入力値.includes('．')) return;
                        内部入力値 += key;
                    }
                }
                if (!内部計算完了フラグ) 内部補助画面文字列 = 内部数式文字列;
            }

            update3DDisplayCanvas();
        }

        function toFullWidthWidthClean(num) {
            if (num === Infinity) return "無限大";
            if (isNaN(num)) return "計算誤り";
            let s = String(Number(num.toFixed(10))); 
            return toFullWidthNum(s);
        }



        // --- 2. Three.js による超リアル光沢写実・虹彩波紋演出付き三次元立体電卓描画 ---
        let container, scene, camera, renderer, calcBoard;
        let buttonMeshMap = {}; 
        let buttonObjects = []; 

        let displayCanvas, displayCtx, displayTexture;
        let displayGlowMaterial; 

        let isMovingCamera = false;
        let hasMovedOrDragged = false; 
        let previousMousePosition = { x: 0, y: 0 };
        let touchStartPos = { x: 0, y: 0 };
        let rotationTargetX = -0.38; 
        let rotationTargetY = 0.38;

        // もっともっと派手な演出用：激しい光彩波紋用の超強力ポイントライト
        let tapRippleLight;
        let rippleLightIntensity = 0;
        let rippleColorIndex = 0;


        const raycaster = new THREE.Raycaster();
        const mouseVector = new THREE.Vector2();

        function 組み立て開始() {
            container = document.getElementById('canvas-section');
            if (!container) return;

            scene = new THREE.Scene();
            scene.background = new THREE.Color('#020305');

            camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, -0.4, 9.8); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping; 

            renderer.toneMappingExposure = 1.2; // 派手さを強調するため露出をアップ
            container.appendChild(renderer.domElement);

            // 環境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // 主光源：超リアルな鏡面ハイライト光沢を強烈に作るシャープライト
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.3);
            mainLight.position.set(5, 9, 8);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048; 
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.bias = -0.0003;
            scene.add(mainLight);

            // 補助光源（サイバー感のある鮮烈なマゼンタ・ピンク光）
            const sideLight = new THREE.DirectionalLight(0xff00ff, 0.6);
            sideLight.position.set(-6, -2, 4);

            scene.add(sideLight);

            // ★ もっともっと派手な演出：打鍵時にボタンから強烈に溢れる超高輝度マルチカラーライト
            tapRippleLight = new THREE.PointLight(0xff007f, 0, 6);
            scene.add(tapRippleLight);

            calcBoard = new THREE.Group();
            scene.add(calcBoard);

            // 筐体ベース（クロームチタン調の超光沢プラスチックボディ）
            const bodyGeo = new THREE.BoxGeometry(5.2, 7.6, 0.45);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: '#1a1f26', 
                roughness: 0.22, // 光沢を増して反射を派手に
                metalness: 0.4
            });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.castShadow = true;
            bodyMesh.receiveShadow = true;

            calcBoard.add(bodyMesh);

            // 超リアル金属外枠（鏡面ポリッシュゴールドアルミベゼル）
            const bezelGeo = new THREE.BoxGeometry(4.8, 1.2, 0.04);
            const bezelMat = new THREE.MeshStandardMaterial({ 
                color: '#ffcc00', // 金色のまばゆいメタリック枠
                roughness: 0.08, 
                metalness: 0.98 
            });
            const bezelMesh = new THREE.Mesh(bezelGeo, bezelMat);
            bezelMesh.position.set(0, 2.9, 0.23);
            calcBoard.add(bezelMesh);

            // 3D液晶ディスプレイ内部
            displayCanvas = document.createElement('canvas');
            displayCanvas.width = 512;
            displayCanvas.height = 128;
            displayCtx = displayCanvas.getContext('2d');
            displayTexture = new THREE.CanvasTexture(displayCanvas);

            update3DDisplayCanvas(); 

            const dispGeo = new THREE.BoxGeometry(4.6, 1.0, 0.02);
            displayGlowMaterial = new THREE.MeshStandardMaterial({ 
                map: displayTexture, 
                roughness: 0.01, 
                metalness: 0.1,
                emissive: new THREE.Color('#ff007f'),
                emissiveIntensity: 0.4
            });
            const dispMesh = new THREE.Mesh(dispGeo, displayGlowMaterial);
            dispMesh.position.set(0, 2.9, 0.25); 
            calcBoard.add(dispMesh);

            // 28ボタンの超本格配置マッピング
            const keysData = [
                ['消去', -1.72, 2.0, '#d92b2b'], ['払', -0.57, 2.0, '#ff9900'],   ['弾', 0.57, 2.0, '#5c6370'],   ['÷', 1.72, 2.0, '#0088ff'],
                ['開平', -1.72, 1.4, '#2ebd59'], ['逆数', -0.57, 1.4, '#2ebd59'], ['円周', 0.57, 1.4, '#2ebd59'], ['×', 1.72, 1.4, '#0088ff'],
                ['乗', -1.72, 0.8, '#2ebd59'],   ['正負', -0.57, 0.8, '#2ebd59'], ['％', 0.57, 0.8, '#2ebd59'],   ['階乗', 1.72, 0.8, '#2ebd59'],

                ['７', -1.72, 0.2, '#282e38'],   ['８', -0.57, 0.2, '#282e38'],   ['９', 0.57, 0.2, '#282e38'],   ['ー', 1.72, 0.2, '#0088ff'],
                ['４', -1.72, -0.4, '#282e38'],  ['５', -0.57, -0.4, '#282e38'],  ['６', 0.57, -0.4, '#282e38'],  ['＋', 1.72, -0.4, '#0088ff'],
                ['１', -1.72, -1.0, '#282e38'],  ['２', -0.57, -1.0, '#282e38'],  ['３', 0.57, -1.0, '#282e38'],  ['＝', 1.72, -1.3, '#ff007f'], // イコールをド派手なネオンピンクに
                ['０', -1.15, -1.6, '#282e38'],                                   ['．', 0.57, -1.6, '#282e38']
            ];

            // 立体ボタン群の生成
            keysData.forEach(k => {
                let name = k[0];
                let bx = k[1];
                let by = k[2];
                let bcolor = k[3];

                let bw = 0.95;
                let bh = 0.45;
                if (name === '＝') { bh = 1.05; by = -1.3; }
                if (name === '０') { bw = 2.1; bx = -1.14; }

                // 外観マテリアル：実機のように美しくエッジが反射する超高光沢樹脂

                const btnGeo = new THREE.BoxGeometry(bw, bh, 0.22);
                const btnMat = new THREE.MeshStandardMaterial({ 
                    color: bcolor, 
                    roughness: 0.1, // 表面を滑らかにしてハイライト反射を最大化
                    metalness: 0.55 // メタリック感を大幅にアップしてド派手に
                });
                const btnMesh = new THREE.Mesh(btnGeo, btnMat);
                btnMesh.position.set(bx, by, 0.22);
                btnMesh.castShadow = true;
                btnMesh.receiveShadow = true;

                // 等倍アスペクト比歪み補正ノード
                const textCanvas = document.createElement('canvas');
                const baseRes = 128;
                textCanvas.width = baseRes;
                textCanvas.height = Math.round(baseRes * (bh / bw));
                
                const tCtx = textCanvas.getContext('2d');
                tCtx.fillStyle = '#ffffff'; 

                
                let fontSize = name.length > 2 ? Math.round(textCanvas.height * 0.4) : (name.length > 1 ? Math.round(textCanvas.height * 0.48) : Math.round(textCanvas.height * 0.58));
                tCtx.font = 'bold ' + fontSize + 'px sans-serif';
                tCtx.textAlign = 'center';
                tCtx.textBaseline = 'middle';
                tCtx.fillText(name, textCanvas.width / 2, textCanvas.height / 2);

                const textTex = new THREE.CanvasTexture(textCanvas);
                
                const labelGeo = new THREE.PlaneGeometry(bw * 0.88, bh * 0.82);
                const labelMat = new THREE.MeshBasicMaterial({ 
                    map: textTex, 
                    transparent: true, 
                    side: THREE.DoubleSide 
                });
                const labelMesh = new THREE.Mesh(labelGeo, labelMat);
                labelMesh.position.set(0, 0, 0.112); 
                btnMesh.add(labelMesh);


                btnMesh.userData = { originalZ: 0.22, keyName: name, targetZ: 0.22 };

                calcBoard.add(btnMesh);
                buttonMeshMap[name] = btnMesh; 
                buttonObjects.push(btnMesh); 
            });

            calcBoard.rotation.x = rotationTargetX;
            calcBoard.rotation.y = rotationTargetY;

            設定操作関連イベント();

            animateLoop();
        }

        // ★ もっともっと派手な演出：時間経過で虹彩オーロラ色に変化する動的グラデーション液晶表示板
        function update3DDisplayCanvas() {
            if (!displayCtx) return;
            

            // 色彩変量を基に、液晶背景をサイバーな極彩色オーロラグラデーションにする
            let 色相度１ = 色彩色彩変量 % 360;
            let 色相度２ = (色彩色彩変量 + 120) % 360;

            let グラデーション = displayCtx.createLinearGradient(0, 0, 512, 128);
            グラデーション.addColorStop(0, 'hsl(' + 色相度１ + ', 80%, 12%)');
            グラデーション.addColorStop(0.5, 'hsl(' + ((色相度１ + 色相度２)/2) + ', 85%, 8%)');
            グラデーション.addColorStop(1, 'hsl(' + 色相度２ + ', 80%, 15%)');

            displayCtx.fillStyle = グラデーション;
            displayCtx.fillRect(0, 0, 512, 128);

            // 液晶の内枠線をド派手なネオンライト風に発光させる
            displayCtx.strokeStyle = 'hsl(' + 色相度１ + ', 100%, 50%)';
            displayCtx.lineWidth = 4;
            displayCtx.strokeRect(3, 3, 506, 122);

            // 上段の小文字式
            displayCtx.fillStyle = '#c9d1d9';

            displayCtx.font = '22px monospace';
            displayCtx.textAlign = 'right';
            displayCtx.shadowColor = 'hsl(' + 色相度１ + ', 100%, 50%)';
            displayCtx.shadowBlur = 4;
            displayCtx.fillText(内部補助画面文字列, 485, 42);

            // 下段の大文字メイン数値（まばゆい純白ネオン発光）
            displayCtx.fillStyle = '#ffffff';
            displayCtx.font = 'bold 48px monospace';
            displayCtx.shadowColor = 'hsl(' + 色相度２ + ', 100%, 60%)';
            displayCtx.shadowBlur = 12;
            displayCtx.fillText(内部入力値, 485, 98);
            
            // 影効果をリセット
            displayCtx.shadowBlur = 0;

            if (displayTexture) displayTexture.needsUpdate = true;
        }


        // 打鍵時の脳汁（ドパ）超ダイナミック沈み込みおよび光彩波紋フラッシュの点火
        function triggerButtonAnimation(keyName) {
            const mesh = buttonMeshMap[keyName];
            if (mesh) {
                // ★ もっともっと派手な演出：これまでの倍以上深く（底まで）一瞬でダイナミックに沈み込むストローク
                mesh.position.z = -0.04; 
                mesh.userData.targetZ = -0.04;
                setTimeout(() => { mesh.userData.targetZ = 0.22; }, 80);

                // 波紋ライトを叩かれたボタンの座標へ自動バインド
                const worldPos = new THREE.Vector3();
                mesh.getWorldPosition(worldPos);
                tapRippleLight.position.copy(worldPos);
                tapRippleLight.position.z += 0.5; 
                
                // 押すたびに七色ランダムに切り替わる強烈なフラッシュ光彩
                let 派手な色群 = [0xff0055, 0x00ffcc, 0xffff00, 0xff00ff, 0x00ffff, 0xff7700];
                rippleColorIndex = (rippleColorIndex + 1) % 派手な色群.length;
                tapRippleLight.color.setHex(派手な色群[rippleColorIndex]);


                // 脳汁光彩強度を限界突破マックスチャージ
                rippleLightIntensity = 8.0;
                if (displayGlowMaterial) {
                    displayGlowMaterial.emissive.setHex(派手な色群[rippleColorIndex]);
                    displayGlowMaterial.emissiveIntensity = 1.6; // 液晶ディスプレイが目の前で爆発するように光る
                }
            }
        }

        // メインフレーム描画更新ループ
        function animateLoop() {
            requestAnimationFrame(animateLoop);

            // 放っておいても液晶のオーロラカラーがじわじわと万華鏡のように揺らめき変化する自動駆動
            色彩色彩変量 += 0.4;
            update3DDisplayCanvas();

            // 視点のスムーズな慣性補間処理
            calcBoard.rotation.x += (rotationTargetX - calcBoard.rotation.x) * 0.12;

            calcBoard.rotation.y += (rotationTargetY - calcBoard.rotation.y) * 0.12;

            // ボタン位置のダイナミック弾性復帰計算
            for (let name in buttonMeshMap) {
                let mesh = buttonMeshMap[name];
                if (mesh.position.z < mesh.userData.targetZ) {
                    mesh.position.z += 0.035; // 素早く跳ね返るバネ感を強化
                    if (mesh.position.z > mesh.userData.targetZ) mesh.position.z = mesh.userData.targetZ;
                }
            }

            // 脳汁光彩波紋の滑らかな減衰物理シミュレーション
            if (rippleLightIntensity > 0) {
                rippleLightIntensity -= 0.35; // 鋭く引くキレのある光の引き際
                if (rippleLightIntensity < 0) rippleLightIntensity = 0;
                tapRippleLight.intensity = rippleLightIntensity;
                
                if (displayGlowMaterial && displayGlowMaterial.emissiveIntensity > 0.4) {
                    displayGlowMaterial.emissiveIntensity -= 0.06;

                }
            }

            renderer.render(scene, camera);
        }

        // 光線判定による3Dボタンタッチ検出
        function check3DButtonHit(screenX, screenY) {
            if (!renderer || !camera) return false;
            const rect = renderer.domElement.getBoundingClientRect();
            mouseVector.x = ((screenX - rect.left) / rect.width) * 2 - 1;
            mouseVector.y = -((screenY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouseVector, camera);
            const intersects = raycaster.intersectObjects(buttonObjects);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                if (hitMesh.userData && hitMesh.userData.keyName) {

                    pressKey(hitMesh.userData.keyName);
                    return true; 
                }
            }
            return false; 
        }

        // --- 3. 操作判定制御（初期化後に安全バインド） ---
        function 設定操作関連イベント() {
            const startAction = (screenX, screenY) => {
                isMovingCamera = true;
                hasMovedOrDragged = false;
                previousMousePosition = { x: screenX, y: screenY };
                touchStartPos = { x: screenX, y: screenY };
            };

            const moveAction = (screenX, screenY) => {
                if (!isMovingCamera) return;
                let deltaX = screenX - previousMousePosition.x;

                let deltaY = screenY - previousMousePosition.y;

                let totalDist = Math.hypot(screenX - touchStartPos.x, screenY - touchStartPos.y);
                if (totalDist > 6) hasMovedOrDragged = true; 

                rotationTargetY += deltaX * 0.007;
                rotationTargetX += deltaY * 0.007;

                if (rotationTargetX > 0.35) rotationTargetX = 0.35;
                if (rotationTargetX < -1.15) rotationTargetX = -1.15;

                previousMousePosition = { x: screenX, y: screenY };
            };

            const stopAction = (e, screenX, screenY) => {
                if (!isMovingCamera) return;
                isMovingCamera = false;
                if (!hasMovedOrDragged) check3DButtonHit(screenX, screenY);
            };


            container.addEventListener('mousedown', (e) => startAction(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => moveAction(e.clientX, e.clientY));
            container.addEventListener('mouseup', (e) => stopAction(e, e.clientX, e.clientY));

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) startAction(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) moveAction(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1) stopAction(e, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            });
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer || !container) return;

            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            update3DDisplayCanvas();
        });

        window.addEventListener('load', 組み立て開始);

        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
